[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-prices-platform"
version = "0.1.0"
description = "Reproducible ingestion of official Open Prices bulk exports"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
open-prices = "open_prices_platform.__main__:main"

[tool.setuptools.packages.find]
include = ["open_prices_platform*"]

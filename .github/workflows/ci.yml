name: Source pipeline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        run: python -m open_prices_platform --help

  spark-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Spark integration tests in the pinned runtime
        run: docker compose run --rm spark tests/spark_checks.py
      - name: Check ingestion on the container's Python 3.10
        run: docker compose run --rm --entrypoint python3 spark -m unittest discover -s tests -v
